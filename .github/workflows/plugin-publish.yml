name: Publish Dify Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manifest.yaml"
      - "provider/**"
      - "tools/**"
      - "utils/**"
      - "_assets/**"
      - "main.py"
      - "requirements.txt"
      - "README.md"
      - "PRIVACY.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  package-and-pr:
    runs-on: ubuntu-latest
    env:
      MARKETPLACE_REPO: langgenius/dify-plugins
      FORK_REPO: bazhauyu-team/dify-plugins
      UPSTREAM_REPO: langgenius/dify-plugins
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Read plugin metadata
        id: meta
        run: |
          PLUGIN_NAME="$(awk -F': ' '/^name:/ {print $2; exit}' manifest.yaml | tr -d '"')"
          VERSION="$(awk -F': ' '/^version:/ {print $2; exit}' manifest.yaml | tr -d '"')"
          AUTHOR="$(awk -F': ' '/^author:/ {print $2; exit}' manifest.yaml | tr -d '"')"
          echo "plugin_name=${PLUGIN_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "author=${AUTHOR}" >> "$GITHUB_OUTPUT"

      - name: Download Dify plugin CLI
        run: |
          curl -L -o dify-plugin-linux-amd64 "https://github.com/langgenius/dify-plugin-daemon/releases/download/0.5.8/dify-plugin-linux-amd64"
          chmod +x dify-plugin-linux-amd64

      - name: Prepare package directory
        run: |
          mkdir -p dist/plugin
          cp -R \
            .env.example \
            LICENSE \
            PRIVACY.md \
            README.md \
            _assets \
            main.py \
            manifest.yaml \
            provider \
            requirements.txt \
            tools \
            utils \
            dist/plugin/

      - name: Package plugin
        run: |
          ./dify-plugin-linux-amd64 plugin package dist/plugin --output_path "${{ steps.meta.outputs.plugin_name }}-${{ steps.meta.outputs.version }}.difypkg"

      - name: Checkout marketplace fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ secrets.PLUGIN_ACTION }}
          path: dify-plugins
          fetch-depth: 0

      - name: Copy package into marketplace fork
        run: |
          TARGET_DIR="dify-plugins/${{ steps.meta.outputs.author }}/${{ steps.meta.outputs.plugin_name }}"
          mkdir -p "$TARGET_DIR"
          cp "${{ steps.meta.outputs.plugin_name }}-${{ steps.meta.outputs.version }}.difypkg" "$TARGET_DIR/"

      - name: Commit and push package
        working-directory: dify-plugins
        run: |
          BRANCH="bump-${{ steps.meta.outputs.plugin_name }}-plugin-${{ steps.meta.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main
          git checkout -B "$BRANCH" upstream/main
          git add "${{ steps.meta.outputs.author }}/${{ steps.meta.outputs.plugin_name }}/${{ steps.meta.outputs.plugin_name }}-${{ steps.meta.outputs.version }}.difypkg"
          if git diff --cached --quiet; then
            echo "No package changes to publish."
            exit 0
          fi
          git commit -m "Add ${{ steps.meta.outputs.plugin_name }} plugin ${{ steps.meta.outputs.version }}"
          git push origin "$BRANCH" --force

      - name: Create pull request
        working-directory: dify-plugins
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        run: |
          BRANCH="bump-${{ steps.meta.outputs.plugin_name }}-plugin-${{ steps.meta.outputs.version }}"
          gh pr create \
            --repo "${MARKETPLACE_REPO}" \
            --head "${{ steps.meta.outputs.author }}:${BRANCH}" \
            --base main \
            --title "Add ${{ steps.meta.outputs.plugin_name }} plugin ${{ steps.meta.outputs.version }}" \
            --body "Automated Dify plugin package update for ${{ steps.meta.outputs.plugin_name }} ${{ steps.meta.outputs.version }}." \
          || gh pr list \
            --repo "${MARKETPLACE_REPO}" \
            --head "${{ steps.meta.outputs.author }}:${BRANCH}" \
            --state open \
            --json url \
            --jq '.[0].url'
