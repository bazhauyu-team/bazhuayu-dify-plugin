identity:
  author: bazhauyu-team
  name: bazhuayu
  label:
    en_US: Bazhuayu
    zh_Hans: 八爪鱼
  description:
    en_US: Bazhuayu cloud scraping tools powered by the Bazhuayu MCP server.
    zh_Hans: 基于八爪鱼 MCP Server 的云采集工具。
  icon: icon.svg
  tags:
    - productivity
    - business
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Bazhuayu API Key
      zh_Hans: 八爪鱼 API Key
    placeholder:
      en_US: Enter your Bazhuayu API Key
      zh_Hans: 请输入八爪鱼 API Key
    help:
      en_US: Used as X-API-Key when calling the Bazhuayu MCP server.
      zh_Hans: 调用八爪鱼 MCP Server 时会作为 X-API-Key 使用。
  mcp_server_url:
    type: text-input
    required: false
    default: https://mcp.bazhuayu.com/
    label:
      en_US: MCP Server URL
      zh_Hans: MCP Server 地址
    placeholder:
      en_US: https://mcp.bazhuayu.com/
      zh_Hans: https://mcp.bazhuayu.com/
    help:
      en_US: Bazhuayu Streamable HTTP MCP endpoint.
      zh_Hans: 八爪鱼 Streamable HTTP MCP 入口地址。
oauth_schema:
  client_schema:
    - name: client_id
      type: text-input
      required: true
      default: BazhuayuWeb_2023
      label:
        en_US: OAuth Client ID
        zh_Hans: OAuth Client ID
    - name: client_secret
      type: secret-input
      required: true
      default: "*"
      label:
        en_US: OAuth Client Secret
        zh_Hans: OAuth Client Secret
      placeholder:
        en_US: "*"
        zh_Hans: "*"
    - name: authorization_url
      type: text-input
      required: true
      default: https://identity.bazhuayu.com/connect/authorize
      label:
        en_US: Authorization URL
        zh_Hans: 授权地址
      placeholder:
        en_US: https://identity.bazhuayu.com/connect/authorize
        zh_Hans: https://identity.bazhuayu.com/connect/authorize
    - name: token_url
      type: text-input
      required: true
      default: https://identity.bazhuayu.com/connect/token
      label:
        en_US: Token URL
        zh_Hans: Token 地址
      placeholder:
        en_US: https://identity.bazhuayu.com/connect/token
        zh_Hans: https://identity.bazhuayu.com/connect/token
    - name: scope
      type: text-input
      required: false
      default: openid profile offline_access
      label:
        en_US: OAuth Scope
        zh_Hans: OAuth Scope
    - name: mcp_server_url
      type: text-input
      required: false
      default: https://mcp.bazhuayu.com/
      label:
        en_US: MCP Server URL
        zh_Hans: MCP Server 地址
  credentials_schema:
    - name: access_token
      type: secret-input
    - name: refresh_token
      type: secret-input
    - name: token_type
      type: text-input
    - name: expires_at
      type: secret-input
    - name: mcp_server_url
      type: text-input
tools:
  - tools/search_templates.yaml
  - tools/execute_task.yaml
  - tools/export_data.yaml
extra:
  python:
    source: bazhuayu.py
