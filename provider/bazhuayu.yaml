identity:
  author: bazhauyu-team
  name: bazhuayu
  label:
    en_US: Bazhuayu
    zh_Hans: 八爪鱼
  description:
    en_US: Bazhuayu cloud scraping tools powered by the Bazhuayu MCP server.
    zh_Hans: 基于八爪鱼 MCP Server 的云采集工具。
  icon: icon.svg
  tags:
    - productivity
    - business
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Bazhuayu API Key
      zh_Hans: 八爪鱼 API Key
    placeholder:
      en_US: Enter your Bazhuayu API Key
      zh_Hans: 请输入八爪鱼 API Key
    help:
      en_US: Used as X-API-Key when calling the Bazhuayu MCP server.
      zh_Hans: 调用八爪鱼 MCP Server 时会作为 X-API-Key 使用。
  mcp_server_url:
    type: text-input
    required: false
    default: https://mcp.bazhuayu.com/
    label:
      en_US: MCP Server URL
      zh_Hans: MCP Server 地址
    placeholder:
      en_US: https://mcp.bazhuayu.com/
      zh_Hans: https://mcp.bazhuayu.com/
    help:
      en_US: Bazhuayu Streamable HTTP MCP endpoint.
      zh_Hans: 八爪鱼 Streamable HTTP MCP 入口地址。
oauth_schema:
  client_schema: []
  credentials_schema:
    - name: access_token
      type: secret-input
      label:
        en_US: Access Token
        zh_Hans: 访问令牌
    - name: refresh_token
      type: secret-input
      label:
        en_US: Refresh Token
        zh_Hans: 刷新令牌
    - name: token_type
      type: text-input
      label:
        en_US: Token Type
        zh_Hans: 令牌类型
    - name: expires_at
      type: secret-input
      label:
        en_US: Expires At
        zh_Hans: 过期时间
    - name: mcp_server_url
      type: text-input
      label:
        en_US: MCP Server URL
        zh_Hans: MCP Server 地址
tools:
  - tools/search_templates.yaml
  - tools/execute_task.yaml
  - tools/export_data.yaml
extra:
  python:
    source: provider/bazhuayu.py
